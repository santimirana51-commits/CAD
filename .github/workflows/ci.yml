name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent-panel/package.json
      - run: npm ci
        working-directory: agent-panel
      - run: npm run test:clean
        working-directory: agent-panel
      - run: npm run build
        working-directory: agent-panel
      - run: npm run preview -- --port 4173 --host 0.0.0.0 &
        working-directory: agent-panel
      - run: npx wait-on http://127.0.0.1:4173 --timeout 30000
      - run: curl -sf http://127.0.0.1:4173/ | head -c 500
